# Sala de Bloquino: la página ya compilada y, del backend, solo la compilación.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    location /api/compile/ {
        proxy_pass http://127.0.0.1:8001/api/compile/;
        proxy_read_timeout 300s;
    }

    # El resto del backend de Velxio (instalar o borrar librerías, grabar
    # placas, proxy de red) no sale a la red de la sala.
    location /api/ {
        return 404;
    }

    # Archivos con el hash en el nombre: no cambian nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La página se pide siempre de nuevo: tras actualizar la imagen, ningún
    # navegador se queda con la anterior.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
